spring:
  datasource:
    hikari:
      maximum-pool-size: 10
  application:
    name: 'furrify-attachment-service'
  main:
      web-application-type: servlet
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  profiles:
    active: prod
  security:
    oauth2:
      client:
        registration:
          keycloak:
            scope: openid
            authorization-grant-type: authorization_code
            client-id: ${KEYCLOAK_CLIENT_ID}
          keycloak-internal:
            provider: keycloak
            client-id: ${KEYCLOAK_SERVICE_CLIENT_ID}
            client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

server:
  port: 8061

springdoc:
  packages-to-exclude: ws.furrify.openapi.gen, org.openapitools.configuration
  api-docs:
    version: openapi_3_0

logging:
  level:
    org.hibernate.validator.internal.metadata.aggregated.CascadingMetaDataBuilder: ERROR

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
