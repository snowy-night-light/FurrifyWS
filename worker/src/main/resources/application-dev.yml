scalar:
  enabled: true

logging:
  level:
    ws.furrify.plugins.fimfarchive: DEBUG

spring:
  datasource:
    driver-class-name: org.h2.Driver
    username: 'sa'
    password: 'password'
    url: jdbc:h2:mem:testdb
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
