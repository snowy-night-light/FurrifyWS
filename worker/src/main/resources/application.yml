scalar:
  enabled: false

spring:
  datasource:
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 180000
      httpclient:
        hc5:
          enabled: true
          max-connections: 1000
          max-connections-per-route: 200
      circuitbreaker:
        enabled: true
    # Spring Cloud's default Resilience4j bulkhead gives every Feign method its own small thread pool
    # (CPU-thread count, queue of 100): too few for an import's parallel calls. The circuit breaker and
    # time limiter still guard every call; ApiConfig caps calls in flight.
    circuitbreaker:
      bulkhead:
        resilience4j:
          enabled: false
  application:
    name: 'furrify-worker-service'
  main:
      web-application-type: servlet
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # HQL's portable JSON functions (json_value: specs on JSON keys, source.data_url backfill) are a tech preview
        query:
          hql:
            json_functions_enabled: true
        jdbc:
          batch_size: 50
  profiles:
    active: prod
  security:
    oauth2:
      client:
        registration:
          keycloak:
            scope: openid
            authorization-grant-type: authorization_code
            client-id: ${KEYCLOAK_CLIENT_ID}
          keycloak-internal:
            provider: keycloak
            client-id: ${KEYCLOAK_SERVICE_CLIENT_ID}
            client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 50
        minimumNumberOfCalls: 20
        permittedNumberOfCallsInHalfOpenState: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 60
        ignoreExceptions:
          - feign.FeignException.FeignClientException
          - feign.RetryableException
          - org.springframework.cloud.client.circuitbreaker.NoFallbackAvailableException
  timelimiter:
    configs:
      default:
        timeoutDuration: 180s

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

server:
  port: 8051
  max-http-request-header-size: 2MB

springdoc:
  packages-to-exclude: ws.furrify.openapi.gen, org.openapitools.configuration
  api-docs:
    version: openapi_3_0

logging:
  level:
    org.hibernate.validator.internal.metadata.aggregated.CascadingMetaDataBuilder: ERROR
    io.documentnode.epub4j: ERROR

furrify:
  worker:
    tasks:
      book:
        max-concurrent: ${FURRIFY_WORKER_TASKS_BOOK_MAX_CONCURRENT:1}